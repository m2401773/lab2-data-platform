name: pr2-platform

# Практическая №2, вариант 5 — сквозная платформа данных кикшеринга «Вжух».
# Стенд облегчённый: тяжёлые движки (Flink, Spark, Airflow, Feast-сервер)
# заменены python-скриптами из ./pipelines, ./rag, ./features — см. отчет.md, раздел 4.

services:
  # ---------- ИСТОЧНИК: операционная БД (справочник клиентов/самокатов) ----------
  pg-oltp:
    image: postgres:16-alpine
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=4
               -c max_wal_senders=4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: vzhuh
    ports:
      - "5433:5432"
    volumes:
      - ./sql/oltp/01_schema_seed.sql:/docker-entrypoint-initdb.d/01_schema_seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "vzhuh"]
      interval: 5s
      retries: 20

  # ---------- ТРАНСПОРТ: Kafka (KRaft, без ZooKeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168        # 7 дней — запас для replay (Kappa)
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  # ---------- CDC: Debezium поверх Kafka Connect ----------
  debezium:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      pg-oltp:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      retries: 30

  # UI для Kafka — удобно смотреть топики и CDC-сообщения
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vzhuh
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
      JAVA_OPTS: "-Xmx256m"

  # ---------- ХРАНЕНИЕ: S3 (SeaweedFS вместо MinIO — как в лабе 4) ----------
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - sw-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 30

  create-buckets:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      sh -c "sleep 3 &&
             echo 's3.bucket.create -name warehouse' | weed shell -master=seaweedfs:9333 &&
             echo 's3.bucket.create -name docs-raw'  | weed shell -master=seaweedfs:9333"
    restart: "no"

  # ---------- МЕТА-БД: каталог Iceberg (JDBC) + pgvector для RAG ----------
  pg-meta:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meta
      POSTGRES_PASSWORD: meta
      POSTGRES_DB: meta
    ports:
      - "5434:5432"
    volumes:
      - ./sql/meta/01_iceberg_catalog.sql:/docker-entrypoint-initdb.d/01_iceberg_catalog.sql:ro
      - ./sql/meta/02_rag.sql:/docker-entrypoint-initdb.d/02_rag.sql:ro
      - pg-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meta"]
      interval: 5s
      retries: 20

  # ---------- SQL-движок Lakehouse ----------
  trino:
    image: trinodb/trino:476
    depends_on:
      pg-meta:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    mem_limit: 3g

  # ---------- ONLINE FEATURE STORE ----------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  sw-data:
  pg-meta-data:
